----- COPY FROM HERE -----
rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

    // Account directory: anyone can see usernames (needed for the sign-in list
    // and for finding people to chat with). Only the owner can remove their entry.
    match /users/{username} {
      allow read: if true;
      allow create: if request.auth != null
                    && request.resource.data.uid == request.auth.uid
                    && request.resource.data.username is string
                    && request.resource.data.username.size() >= 2
                    && request.resource.data.username.size() <= 20;
      allow update: if false;
      allow delete: if request.auth != null && resource.data.uid == request.auth.uid;
    }

    // Chats: only the two members can read or change them.
    match /chats/{chatId} {
      allow read: if request.auth != null
                  && request.auth.uid in resource.data.members;
      allow create: if request.auth != null
                    && request.auth.uid in request.resource.data.members
                    && request.resource.data.members.size() == 2;
      allow update: if request.auth != null
                    && request.auth.uid in resource.data.members
                    && request.resource.data.members == resource.data.members;
      allow delete: if false;

      // Messages: only chat members can read; you can only send as yourself.
      match /messages/{msgId} {
        allow read: if request.auth != null
                    && request.auth.uid in get(/databases/$(database)/documents/chats/$(chatId)).data.members;
        allow create: if request.auth != null
                      && request.resource.data.from == request.auth.uid
                      && request.auth.uid in get(/databases/$(database)/documents/chats/$(chatId)).data.members
                      && request.resource.data.text is string
                      && request.resource.data.text.size() > 0
                      && request.resource.data.text.size() <= 2000;
        allow update, delete: if false;
      }
    }
  }
}

# StarChat setup (Firebase + GitHub Pages)

You need a free Google account. This takes about 10 minutes.

## 1. Create a Firebase project
1. Go to https://console.firebase.google.com and click **Add project**.
2. Name it (e.g. `starchat`). You can turn off Google Analytics. Click **Create**.

## 2. Turn on sign-in
1. In the left menu: **Build → Authentication → Get started**.
2. Under **Sign-in method**, click **Email/Password**, switch **Enable** on, and save.

## 3. Create the database
1. **Build → Firestore Database → Create database**.
2. Pick a location near you and choose **Start in production mode**. Click **Create**.
3. Open the **Rules** tab, delete what's there, paste the whole contents of `firestore.rules`, and click **Publish**.

## 4. Get your config
1. Click the **gear icon → Project settings → General**.
2. Scroll to **Your apps** and click the **</>** (Web) icon. Give it a nickname and register it (no hosting needed).
3. Copy the `firebaseConfig` object it shows.
4. Open `index.html`, find `const firebaseConfig = {...}` near the top, and replace the `PASTE_YOUR_...` values with yours.

## 5. Put it on GitHub Pages
1. Create a new repository on https://github.com (e.g. `starchat`). Make it **Public**.
2. Upload `index.html` (and `firestore.rules` and this file, if you like). Commit.
3. Go to **Settings → Pages**. Under **Build and deployment**, choose **Deploy from a branch**, pick `main` and `/ (root)`, and save.
4. After a minute your site is at `https://YOUR-USERNAME.github.io/starchat/`.

## 6. Authorize your GitHub Pages domain
1. In Firebase: **Authentication → Settings → Authorized domains → Add domain**.
2. Add `YOUR-USERNAME.github.io`. Without this, sign-in will be blocked.

## 7. Test it
Open the site on two devices, create an account on each, then tap **+** and message each other.

## Notes
- Accounts are Firebase email/password logins using `username@starchat.app` behind the scenes. Users never see this.
- Usernames are visible to everyone. Chats and messages are visible only to the two people in them.
- This is not end-to-end encrypted like WhatsApp. Firebase can read the data on its servers. Don't use it for sensitive information.

<script type="module">
// ============================================================
// STEP 1: Paste your Firebase config here (see SETUP.md)
// ============================================================
const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "PASTE_YOUR_PROJECT.firebaseapp.com",
  projectId: "PASTE_YOUR_PROJECT_ID",
  storageBucket: "PASTE_YOUR_PROJECT.appspot.com",
  messagingSenderId: "PASTE_YOUR_SENDER_ID",
  appId: "PASTE_YOUR_APP_ID"
};
// ============================================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged, deleteUser
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, deleteDoc,
  query, where, orderBy, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = document.getElementById('app');
const logoTpl = document.getElementById('tpl-logo').innerHTML;

const configured = !Object.values(firebaseConfig).some(v => String(v).startsWith('PASTE_'));
let auth = null, db = null;
if (configured) {
  const fb = initializeApp(firebaseConfig);
  auth = getAuth(fb);
  db = getFirestore(fb);
}

const TEAM = { id:'starchat', name:'StarChat', initial:'S',
  greeting:"Welcome to StarChat! Tap + on the chat list to message another StarChat account." };
const REPLIES = ["Got it 👍","Haha true","Sounds good, talk soon.","Okay, noted!","Nice, thanks for the update.","Let's catch up later.","👍👍"];
const USERNAME_RE = /^[A-Za-z0-9_.-]{2,20}$/;

const state = {
  accounts: [],             // [{ key, name, uid }] everyone with an account
  chats: [],                // [{ id, other, otherName, last }]
  session: null,            // { uid, key, name }
  pendingAccount: null,
  view: 'loading',
  activeContact: null,      // 'starchat' or other user's uid
  activeName: '',
  team: [{ from:'them', text:TEAM.greeting, time:nowStr() }],
  chatsUnsub: null,
  convoUnsub: null,
  toastTimer: null,
  authChecked: false
};

// ---------- helpers ----------
function nowStr(){ return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
function initials(name){ return (name||'?').trim().charAt(0).toUpperCase(); }
function escapeHtml(str){ const d=document.createElement('div'); d.textContent = str==null ? '' : String(str); return d.innerHTML; }
function emailFor(key){ return key + '@starchat.app'; }
function chatIdFor(a,b){ return [a,b].sort().join('_'); }
function nameOfUid(uid){ const a = state.accounts.find(x=>x.uid===uid); return a ? a.name : 'Unknown'; }
function showToast(msg){
  let t = app.querySelector('.toast');
  if(!t){ t=document.createElement('div'); t.className='toast'; app.appendChild(t); }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function screenEl(cls){
  const d=document.createElement('div');
  d.className='screen '+(cls||'');
  d.style.display='flex';
  app.appendChild(d);
  return d;
}
function friendlyAuthError(e){
  const c = e && e.code || '';
  if(c==='auth/invalid-credential' || c==='auth/wrong-password' || c==='auth/invalid-login-credentials') return 'Incorrect password. Try again.';
  if(c==='auth/too-many-requests') return 'Too many attempts. Wait a minute and try again.';
  if(c==='auth/network-request-failed') return 'No connection. Check your internet and try again.';
  if(c==='auth/weak-password') return 'Password must be at least 6 characters.';
  return 'Something went wrong. Try again.';
}

// ---------- realtime data ----------
function subscribeAccounts(){
  onSnapshot(collection(db,'users'), snap=>{
    state.accounts = snap.docs.map(d=>({ key:d.id, name:d.data().username, uid:d.data().uid }));
    if(state.view==='select' || state.view==='newchat') render();
  }, ()=>{ showToast('Cannot load accounts. Check Firestore rules.'); });
}
function subscribeChats(uid){
  if(state.chatsUnsub) state.chatsUnsub();
  const q = query(collection(db,'chats'), where('members','array-contains', uid));
  state.chatsUnsub = onSnapshot(q, snap=>{
    state.chats = snap.docs.map(d=>{
      const v = d.data();
      const other = (v.members||[]).find(m=>m!==uid);
      return { id:d.id, other, otherName: (v.names && v.names[other]) || nameOfUid(other), last: v.last || null };
    }).filter(c=>c.other)
      .sort((a,b)=>((b.last&&b.last.ts)||0)-((a.last&&a.last.ts)||0));
    if(state.view==='chatlist') render();
  }, ()=>{ showToast('Cannot load chats. Check Firestore rules.'); });
}
function unsubscribeChats(){
  if(state.chatsUnsub){ state.chatsUnsub(); state.chatsUnsub=null; }
  state.chats = [];
}

// ---------- render router ----------
async function render(){
  if(state.convoUnsub){ state.convoUnsub(); state.convoUnsub=null; }
  app.querySelectorAll('.screen').forEach(el=>el.remove());
  if(!configured){ renderSetup(); return; }
  if(!state.authChecked){ renderLoading(); return; }
  switch(state.view){
    case 'select':   renderSelect(); break;
    case 'login':    renderLogin(); break;
    case 'create':   renderCreate(); break;
    case 'chatlist': renderChatList(); break;
    case 'newchat':  renderNewChat(); break;
    case 'convo':    renderConvo(); break;
    case 'settings': renderSettings(); break;
  }
}

function renderSetup(){
  const s = screenEl('auth-screen');
  s.innerHTML = `
    <div class="auth-hero">${logoTpl}<h1>StarChat</h1><p>Setup needed</p></div>
    <div class="setup-box">
      Open <b>index.html</b> and replace the <b>PASTE_YOUR_…</b> values in <b>firebaseConfig</b> with your Firebase project settings. See <b>SETUP.md</b> for the steps.
    </div>`;
}
function renderLoading(){
  const s = screenEl('auth-screen');
  s.innerHTML = `<div class="auth-hero">${logoTpl}<h1>StarChat</h1><p>Loading…</p></div>`;
}

// ---------- SELECT ACCOUNT ----------
function renderSelect(){
  const s = screenEl('auth-screen');
  s.innerHTML = `
    <div class="auth-hero">${logoTpl}<h1>StarChat</h1><p>Secure, simple messaging.</p></div>
    <div id="acct-list"></div>
    <button class="btn btn-primary" id="new-acct-btn">+ Create new account</button>`;
  const list = s.querySelector('#acct-list');
  if(state.accounts.length===0){
    list.innerHTML = `<div class="empty-note">No accounts yet. Create one to get started.</div>`;
  } else {
    list.innerHTML = `<div class="field"><label>Choose your account</label></div>`;
    state.accounts.forEach(a=>{
      const row = document.createElement('div');
      row.className='account-row';
      row.innerHTML = `<div class="avatar">${escapeHtml(initials(a.name))}</div>
        <div><div class="name">${escapeHtml(a.name)}</div><div class="sub">Tap to sign in</div></div>`;
      row.onclick = ()=>{ state.pendingAccount=a; state.view='login'; render(); };
      list.appendChild(row);
    });
  }
  s.querySelector('#new-acct-btn').onclick = ()=>{ state.view='create'; render(); };
}

// ---------- LOGIN ----------
function renderLogin(){
  const acct = state.pendingAccount;
  const s = screenEl('auth-screen');
  s.innerHTML = `
    <div class="back-row" id="back-btn">‹ Back</div>
    <div class="auth-hero">
      <div class="avatar" style="width:72px;height:72px;font-size:26px;margin:0 auto 12px;">${escapeHtml(initials(acct.name))}</div>
      <h1 style="font-size:21px;">${escapeHtml(acct.name)}</h1>
      <p>Enter your password to continue</p>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="pw-input" placeholder="Enter password">
      <div class="field-error" id="pw-err"></div>
    </div>
    <button class="btn btn-primary" id="login-btn">Log in</button>`;
  s.querySelector('#back-btn').onclick = ()=>{ state.view='select'; render(); };
  const pw = s.querySelector('#pw-input');
  const err = s.querySelector('#pw-err');
  const btn = s.querySelector('#login-btn');
  const doLogin = async ()=>{
    if(!pw.value){ err.textContent='Enter your password.'; return; }
    btn.disabled = true; err.textContent='';
    try{
      const cred = await signInWithEmailAndPassword(auth, emailFor(acct.key), pw.value);
      await enterApp({ uid:cred.user.uid, key:acct.key, name:acct.name });
    }catch(e){
      err.textContent = friendlyAuthError(e);
      pw.value=''; btn.disabled=false;
    }
  };
  btn.onclick = doLogin;
  pw.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

// ---------- CREATE ACCOUNT ----------
function renderCreate(){
  const s = screenEl('auth-screen');
  s.innerHTML = `
    <div class="back-row" id="back-btn">‹ Back</div>
    <div class="auth-hero">${logoTpl}<h1 style="font-size:22px;">Create your account</h1>
      <p>Pick a username and a password.</p></div>
    <div class="field"><label>Username (letters, numbers, _ . -)</label><input type="text" id="name-input" placeholder="e.g. jordan"></div>
    <div class="field"><label>Password</label><input type="password" id="pw1-input" placeholder="At least 6 characters"></div>
    <div class="field"><label>Confirm password</label><input type="password" id="pw2-input" placeholder="Re-enter password">
      <div class="field-error" id="create-err"></div></div>
    <button class="btn btn-primary" id="create-btn">Create account</button>`;
  s.querySelector('#back-btn').onclick = ()=>{ state.view='select'; render(); };
  const btn = s.querySelector('#create-btn');
  btn.onclick = async ()=>{
    const name = s.querySelector('#name-input').value.trim();
    const pw1 = s.querySelector('#pw1-input').value;
    const pw2 = s.querySelector('#pw2-input').value;
    const err = s.querySelector('#create-err');
    if(!USERNAME_RE.test(name)){ err.textContent='Use 2–20 letters, numbers, _ . or -.'; return; }
    if(pw1.length < 6){ err.textContent='Password must be at least 6 characters.'; return; }
    if(pw1 !== pw2){ err.textContent='Passwords do not match.'; return; }
    const key = name.toLowerCase();
    btn.disabled = true; err.textContent='';
    try{
      const taken = await getDoc(doc(db,'users',key));
      if(taken.exists()){ err.textContent='That username is already taken.'; btn.disabled=false; return; }
      const cred = await createUserWithEmailAndPassword(auth, emailFor(key), pw1);
      await setDoc(doc(db,'users',key), { username:name, uid:cred.user.uid, createdAt:Date.now() });
      await enterApp({ uid:cred.user.uid, key, name });
    }catch(e){
      err.textContent = (e && e.code==='auth/email-already-in-use') ? 'That username is already taken.' : friendlyAuthError(e);
      btn.disabled=false;
    }
  };
}

async function enterApp(session){
  state.session = session;
  state.view = 'chatlist';
  subscribeChats(session.uid);
  render();
}

// ---------- CHAT LIST ----------
function renderChatList(){
  const s = screenEl('');
  const top = document.createElement('div');
  top.className='topbar';
  top.innerHTML = `
    <div class="brandmark">${logoTpl}<span class="brand-name">StarChat</span></div>
    <div style="display:flex;gap:8px;">
      <button class="icon-btn" id="newchat-btn">＋</button>
      <button class="icon-btn" id="settings-btn">⚙︎</button>
    </div>`;
  s.appendChild(top);
  const list = document.createElement('div');
  list.className='chat-list';
  s.appendChild(list);

  const team = state.team[state.team.length-1];
  const teamRow = document.createElement('div');
  teamRow.className='chat-row';
  teamRow.innerHTML = `
    <div class="avatar">${TEAM.initial}</div>
    <div class="chat-meta">
      <div class="top"><span class="cname">${TEAM.name}</span><span class="time">${escapeHtml(team.time)}</span></div>
      <div class="preview">${escapeHtml(team.text)}</div>
    </div>`;
  teamRow.onclick = ()=>{ state.activeContact='starchat'; state.activeName=TEAM.name; state.view='convo'; render(); };
  list.appendChild(teamRow);

  if(state.chats.length===0){
    const note = document.createElement('div');
    note.className='empty-note';
    note.textContent = 'No chats yet. Tap + to message another StarChat account.';
    list.appendChild(note);
  }
  state.chats.forEach(c=>{
    const mine = c.last && c.last.from===state.session.uid;
    const row = document.createElement('div');
    row.className='chat-row';
    row.innerHTML = `
      <div class="avatar">${escapeHtml(initials(c.otherName))}</div>
      <div class="chat-meta">
        <div class="top"><span class="cname">${escapeHtml(c.otherName)}</span><span class="time">${c.last?escapeHtml(c.last.time):''}</span></div>
        <div class="preview">${c.last?escapeHtml((mine?'You: ':'')+c.last.text):''}</div>
      </div>`;
    row.onclick = ()=>{ state.activeContact=c.other; state.activeName=c.otherName; state.view='convo'; render(); };
    list.appendChild(row);
  });

  top.querySelector('#newchat-btn').onclick = ()=>{ state.view='newchat'; render(); };
  top.querySelector('#settings-btn').onclick = ()=>{ state.view='settings'; render(); };
}

// ---------- NEW CHAT ----------
function renderNewChat(){
  const s = screenEl('');
  const top = document.createElement('div');
  top.className='convo-topbar';
  top.innerHTML = `<button class="icon-btn" id="back-btn" style="background:transparent;">‹</button><div class="cname">New chat</div>`;
  s.appendChild(top);
  const body = document.createElement('div');
  body.className='settings-body';
  body.innerHTML = `
    <div class="field"><input type="text" id="search-input" placeholder="Search StarChat accounts"></div>
    <div id="dir-list"></div>`;
  s.appendChild(body);
  top.querySelector('#back-btn').onclick = ()=>{ state.view='chatlist'; render(); };

  const dirList = body.querySelector('#dir-list');
  function paint(filter){
    dirList.innerHTML='';
    const names = state.accounts
      .filter(a=>a.uid!==state.session.uid)
      .filter(a=>a.name.toLowerCase().includes(filter.toLowerCase()));
    if(names.length===0){
      dirList.innerHTML = `<div class="empty-note">No matching accounts. Ask your friend to create a StarChat account first.</div>`;
      return;
    }
    names.forEach(a=>{
      const row = document.createElement('div');
      row.className='account-row';
      row.innerHTML = `<div class="avatar">${escapeHtml(initials(a.name))}</div><div><div class="name">${escapeHtml(a.name)}</div><div class="sub">Tap to start chatting</div></div>`;
      row.onclick = ()=>{ state.activeContact=a.uid; state.activeName=a.name; state.view='convo'; render(); };
      dirList.appendChild(row);
    });
  }
  paint('');
  body.querySelector('#search-input').addEventListener('input', e=>paint(e.target.value));
}

// ---------- CONVERSATION ----------
function renderConvo(){
  const isTeam = state.activeContact==='starchat';
  const me = state.session.uid;
  const other = state.activeContact;
  const displayName = state.activeName || (isTeam ? TEAM.name : 'Chat');

  const s = screenEl('');
  const top = document.createElement('div');
  top.className='convo-topbar';
  top.innerHTML = `
    <button class="icon-btn" id="back-btn" style="background:transparent;">‹</button>
    <div class="avatar" style="width:38px;height:38px;font-size:14px;">${escapeHtml(initials(displayName))}</div>
    <div><div class="cname">${escapeHtml(displayName)}</div><div class="status">${isTeam?'official':'StarChat account'}</div></div>`;
  s.appendChild(top);

  const wrap = document.createElement('div');
  wrap.className='messages';
  s.appendChild(wrap);

  function paint(msgs){
    wrap.innerHTML='';
    msgs.forEach(m=>{
      const b = document.createElement('div');
      const mine = m.from===me;
      b.className = 'bubble ' + (mine?'mine':'theirs');
      b.innerHTML = `${escapeHtml(m.text)}<div class="msg-time">${escapeHtml(m.time)}</div>`;
      wrap.appendChild(b);
    });
    wrap.scrollTop = wrap.scrollHeight;
  }

  const composer = document.createElement('div');
  composer.className='composer';
  composer.innerHTML = `<input type="text" id="msg-input" placeholder="Message"><button class="send-btn" id="send-btn">➤</button>`;
  s.appendChild(composer);
  const input = composer.querySelector('#msg-input');

  const chatId = isTeam ? null : chatIdFor(me, other);
  if(isTeam){
    paint(state.team);
  } else {
    const q = query(collection(db,'chats',chatId,'messages'), orderBy('ts','asc'));
    state.convoUnsub = onSnapshot(q, snap=>{
      if(state.view==='convo' && state.activeContact===other){
        paint(snap.docs.map(d=>d.data()));
      }
    }, ()=>{
      // A brand-new chat has no messages yet, which Firestore reports as a permission error; show it as empty.
      if(state.view==='convo' && state.activeContact===other) paint([]);
    });
  }

  async function send(){
    const text = input.value.trim();
    if(!text) return;
    input.value='';
    const now = Date.now(), time = nowStr();
    if(isTeam){
      state.team.push({ from:'me', text, time });
      paint(state.team);
      setTimeout(()=>{
        state.team.push({ from:'them', text: REPLIES[Math.floor(Math.random()*REPLIES.length)], time: nowStr() });
        if(state.view==='convo' && state.activeContact==='starchat') paint(state.team);
      }, 900 + Math.random()*900);
      return;
    }
    try{
      // Make sure the chat exists first (the message rules check its members).
      await setDoc(doc(db,'chats',chatId), {
        members: [me, other].sort(),
        names: { [me]: state.session.name, [other]: displayName },
        last: { text, from:me, ts:now, time }
      }, { merge:true });
      await addDoc(collection(db,'chats',chatId,'messages'), { from:me, text, ts:now, time });
    }catch(e){
      showToast('Message not sent. Check your connection.');
      input.value = text;
    }
  }
  composer.querySelector('#send-btn').onclick = send;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
  top.querySelector('#back-btn').onclick = ()=>{ state.view='chatlist'; render(); };
}

// ---------- SETTINGS ----------
function renderSettings(){
  const s = screenEl('');
  const top = document.createElement('div');
  top.className='convo-topbar';
  top.innerHTML = `<button class="icon-btn" id="back-btn" style="background:transparent;">‹</button><div class="cname">Settings</div>`;
  s.appendChild(top);
  const body = document.createElement('div');
  body.className='settings-body';
  body.innerHTML = `
    <div class="profile-card">
      <div class="avatar">${escapeHtml(initials(state.session.name))}</div>
      <div><div class="name">${escapeHtml(state.session.name)}</div><div class="sub">StarChat account</div></div>
    </div>
    <div class="settings-group">
      <h3>Account</h3>
      <div class="settings-item" id="logout-item">Log out</div>
      <div class="settings-item danger" id="delete-item">Delete account</div>
    </div>
    <div class="settings-group">
      <h3>About</h3>
      <div class="settings-item" style="cursor:default;color:var(--muted);">Your account and chats are stored in StarChat's online database, so friends on other devices can find and message you.</div>
    </div>`;
  s.appendChild(body);
  top.querySelector('#back-btn').onclick = ()=>{ state.view='chatlist'; render(); };
  body.querySelector('#logout-item').onclick = async ()=>{
    await signOut(auth);
    unsubscribeChats();
    state.session=null; state.pendingAccount=null; state.view='select';
    render(); showToast('Logged out');
  };
  body.querySelector('#delete-item').onclick = openDeleteModal;
}

function openDeleteModal(){
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Delete account</h3>
      <p>This permanently deletes "${escapeHtml(state.session.name)}" from StarChat. Enter your password to confirm.</p>
      <div class="field">
        <input type="password" id="del-pw" placeholder="Password">
        <div class="field-error" id="del-err"></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="del-cancel">Cancel</button>
        <button class="btn btn-danger" id="del-confirm">Delete</button>
      </div>
    </div>`;
  app.appendChild(overlay);
  overlay.querySelector('#del-cancel').onclick = ()=>overlay.remove();
  overlay.querySelector('#del-confirm').onclick = async ()=>{
    const pw = overlay.querySelector('#del-pw').value;
    const errEl = overlay.querySelector('#del-err');
    const { key, name, uid } = state.session;
    try{
      // Re-check the password (this also gives a fresh login, which deletion requires).
      const cred = await signInWithEmailAndPassword(auth, emailFor(key), pw);
      if(cred.user.uid !== uid){ errEl.textContent='Incorrect password.'; return; }
      const saved = await getDoc(doc(db,'users',key));
      await deleteDoc(doc(db,'users',key));
      try{
        await deleteUser(cred.user);
      }catch(err){
        // Put the directory entry back if the login account could not be removed.
        if(saved.exists()) await setDoc(doc(db,'users',key), saved.data());
        errEl.textContent = 'Could not delete right now. Try again.';
        return;
      }
      overlay.remove();
      unsubscribeChats();
      state.session=null; state.pendingAccount=null; state.view='select';
      render(); showToast('Account deleted');
    }catch(e){
      errEl.textContent = friendlyAuthError(e);
    }
  };
}

// ---------- boot ----------
if(configured){
  subscribeAccounts();
  let firstEvent = true;
  onAuthStateChanged(auth, async user=>{
    if(firstEvent){
      firstEvent = false;
      if(user && !state.session){
        // Restore a signed-in session after reloading the page.
        const snap = await getDocs(query(collection(db,'users'), where('uid','==',user.uid)));
        if(!snap.empty){
          const d = snap.docs[0];
          state.session = { uid:user.uid, key:d.id, name:d.data().username };
          state.view = 'chatlist';
          subscribeChats(user.uid);
        }
      }
      state.authChecked = true;
      if(state.view==='loading') state.view='select';
      render();
    }
  });
} else {
  state.authChecked = true;
  render();
}
</script>
